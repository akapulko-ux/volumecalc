<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Force Update Admin</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 24px; display: grid; place-items: center; background: #0e1116; color: #f5f6f7; }
    .card { width: min(480px, 100%); background: #161b22; border: 1px solid #262b33; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: #f5f6f7; }
    button { width: 100%; margin-top: 16px; padding: 12px; border: none; border-radius: 12px; background: #238636; color: #fff; font-weight: 700; cursor: pointer; }
    .status { margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Force Update</h2>
    <p>Set Remote Config parameters for the iOS app.</p>
    <label for="version">minSupportedVersion (e.g. 1.0.0)</label>
    <input id="version" placeholder="1.0.0" />
    <label for="link">forceUpdateLink (App Store URL)</label>
    <input id="link" placeholder="https://apps.apple.com/app/idXXXXXXXXX" />
    <label for="secret">Admin secret (X-Admin-Secret)</label>
    <input id="secret" type="password" placeholder="set from env FORCE_UPDATE_SECRET" />
    <label for="endpoint">Cloud Function endpoint</label>
    <input id="endpoint" placeholder="https://us-central1-YOUR_PROJECT.cloudfunctions.net/setMinVersion" />
    <button id="submit">Apply</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    async function update() {
      const version = document.getElementById('version').value.trim();
      const link = document.getElementById('link').value.trim();
      const secret = document.getElementById('secret').value.trim();
      const endpoint = document.getElementById('endpoint').value.trim();
      const statusEl = document.getElementById('status');

      if (!version || !endpoint) {
        statusEl.textContent = 'Version and endpoint are required';
        statusEl.style.color = '#f85149';
        return;
      }
      statusEl.textContent = 'Updating...';
      statusEl.style.color = '#f5f6f7';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Secret': secret,
          },
          body: JSON.stringify({ minSupportedVersion: version, forceUpdateLink: link }),
        });
        if (!res.ok) {
          const text = await res.text();
          statusEl.textContent = `Failed: ${res.status} ${text}`;
          statusEl.style.color = '#f85149';
          return;
        }
        const data = await res.json();
        statusEl.textContent = `Updated to ${data.minSupportedVersion} (link: ${data.forceUpdateLink || 'none'})`;
        statusEl.style.color = '#3fb950';
      } catch (e) {
        statusEl.textContent = `Error: ${e.message}`;
        statusEl.style.color = '#f85149';
      }
    }

    document.getElementById('submit').addEventListener('click', update);
  </script>
</body>
</html>
